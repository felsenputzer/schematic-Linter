name: Windows

on:
  push:
  pull_request:

jobs:
  test-windows:
    name: pytest (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Linter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install schematic-linter (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v -rs

  build-and-smoke-test-windows:
    name: Build + smoke-test standalone .exes (windows-latest)
    needs: test-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build standalone exe (PyInstaller)
        working-directory: Linter/packaging/windows
        run: .\build.ps1

      - name: Smoke test the built CLI exe against TestData/Projekt1
        run: |
          $exe = "Linter\packaging\windows\dist\schematic-linter.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build did not produce $exe"
            exit 1
          }

          $outputDir = "smoke-test-output"
          & $exe analyze "TestData\Projekt1" --output $outputDir
          $exitCode = $LASTEXITCODE

          # TestData/Projekt1 is a known sample with one hand-verified Error
          # finding, so the CLI is expected to exit 1 -- anything else means
          # the bundled exe didn't actually run the real analysis correctly.
          # (Explicit `exit 0`/`exit 1` below, rather than letting the script
          # fall off the end, because pwsh steps in Actions otherwise adopt
          # the *last external command's* $LASTEXITCODE as the step's own --
          # which here would be the intentional non-zero exit code we're
          # asserting on, wrongly failing an otherwise-passing smoke test.)
          if ($exitCode -ne 1) {
            Write-Error "Expected exit code 1 from analyzing TestData/Projekt1, got $exitCode"
            exit 1
          }

          foreach ($file in @("report.html", "graph.json")) {
            $path = Join-Path $outputDir $file
            if (-not (Test-Path $path)) {
              Write-Error "Expected output file was not produced: $path"
              exit 1
            }
          }

          Write-Host "Smoke test passed: exe ran standalone, exit code $exitCode, report.html and graph.json produced."
          exit 0

      - name: Smoke test the built GUI exe against TestData/Projekt1
        run: |
          $exe = "Linter\packaging\windows\dist\SchematicLinter.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build did not produce $exe"
            exit 1
          }

          # --smoke-test opens the real window, clicks through one full run
          # programmatically and exits with the CLI's exit code. It's a
          # windowed (no-console) exe, so wait for it via Start-Process.
          $outputDir = "smoke-test-gui-output"
          $proc = Start-Process -FilePath $exe -ArgumentList "--smoke-test", "TestData\Projekt1", $outputDir -Wait -PassThru
          if ($proc.ExitCode -ne 1) {
            Write-Error "Expected exit code 1 from the GUI smoke test, got $($proc.ExitCode)"
            exit 1
          }
          foreach ($file in @("report.html", "graph.json")) {
            $path = Join-Path $outputDir $file
            if (-not (Test-Path $path)) {
              Write-Error "Expected output file was not produced: $path"
              exit 1
            }
          }
          Write-Host "GUI smoke test passed."
          exit 0

      - name: Upload built exes
        uses: actions/upload-artifact@v7
        with:
          name: schematic-linter-windows
          path: |
            Linter/packaging/windows/dist/SchematicLinter.exe
            Linter/packaging/windows/dist/schematic-linter.exe
